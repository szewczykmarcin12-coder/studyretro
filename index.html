  }

    font-weight: 700;
    color: rgba(255,255,255,.85);

    max-width: 1180px;
    margin: 0 auto;
    padding: 14px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 14px;
    align-items: start;
  }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; top: 0; height: auto; }
    .progress-wrap { width: 100%; max-width: 100%; }
    .header .row { flex-direction: column; }

    margin-top: -2px;

    margin-top: 10px;

  .op.gw { border-color: rgba(248,113,113,.60); background: rgba(239,68,68,.18); text-decoration: line-through; opacity: .85; }

  .fb {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: .9rem;
    font-weight: 800;
    display: none;

/* ====== LOGIKA TESTU (zachowana, ale dostosowana do podzbioru + sidebar) ====== */
var allIdx = Q.map(function(_, i){ return i; });
var activeIdx = allIdx.slice();         // aktualnie używany zestaw pytań
var mode = "all";                        // "all" | "rnd30"
var st = [];                             // zaznaczenia (dla wszystkich pytań, niezależnie od trybu)
var ta = 0, tc = 0, fw = false;          // answered, correct, filterWrong
var sections = [];                       // sekcje aktualnego widoku

function initStateOnce() {
  if (st.length !== Q.length) {
    st = new Array(Q.length).fill(-1);
  }
}
initStateOnce();

/* znajdź nazwę sekcji dla dowolnego indeksu (nawet gdy losowanie zacznie się w środku sekcji) */
function sectionNameForIndex(i) {
  for (var k = i; k >= 0; k--) {
    if (Q[k].s) return Q[k].s;
  }
  return "Inne";
}

/* buduj sekcje na podstawie activeIdx (w kolejności w dokumencie) */
function buildSectionsFromActive() {
  var idxSorted = activeIdx.slice().sort(function(a,b){ return a-b; });
  var map = new Map();
  var order = [];

  for (var t = 0; t < idxSorted.length; t++) {
    var qi = idxSorted[t];
    var nm = sectionNameForIndex(qi);
    if (!map.has(nm)) {
      map.set(nm, { nm: nm, indices: [], ok: 0, ans: 0, anchor: null });
      order.push(nm);
    }
    map.get(nm).indices.push(qi);
  }

  sections = order.map(function(nm, si){
    var s = map.get(nm);
    s.anchor = "s" + si;
    // policz statystyki sekcji (tylko w aktywnych pytaniach)
    var ok = 0, ans = 0;
    for (var x = 0; x < s.indices.length; x++) {
      var qi = s.indices[x];
      if (st[qi] !== -1) {
        ans++;
        if (st[qi] === Q[qi].c) ok++;
      }
    }
    s.ok = ok;
    s.ans = ans;
    return s;
  });
}

function render() {
  initStateOnce();
  buildSectionsFromActive();

  var L = "abcd";
  var h = "";

  for (var si = 0; si < sections.length; si++) {
    var sec = sections[si];
    h += '<div class="st" id="'+sec.anchor+'">'
      +  '<span>'+sec.nm+' ('+sec.indices.length+' pyt.)</span>'
      +  '<span class="ss" id="ss'+si+'"></span>'
      + '</div>';

    for (var t = 0; t < sec.indices.length; t++) {
      var i = sec.indices[t];
      var q = Q[i];

      h += '<div class="qc" id="q'+i+'">'
        +  '<div class="qn">Pytanie '+q.n+' / 210</div>'
        +  '<div class="qt">'+q.q+'</div>'
        +  '<div class="opts">';

      for (var j = 0; j < q.o.length; j++) {
        h += '<label class="op" id="o'+i+'_'+j+'" onclick="pk('+i+','+j+')">'
          +  '<input type="radio" name="r'+i+'" value="'+j+'">'
          +  '<span>'+L[j]+') '+q.o[j]+'</span>'
          + '</label>';
      }

      h += '</div><div class="fb" id="f'+i+'"></div></div>';
    }
  }

  document.getElementById("ct").innerHTML = h;

  // sidebar tabs
  var nav = document.getElementById("cn");
  nav.innerHTML = sections.map(function(s, i){
    var sc = (s.ans > 0) ? (s.ok + "/" + s.ans) : "—";
    return '<div class="tab" onclick="document.getElementById(\''+s.anchor+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'
      +  '<span>'+s.nm+'</span>'
      +  '<span class="meta"><span class="score" id="cs'+i+'">('+sc+')</span></span>'
      + '</div>';
  }).join("");

  // odtwórz stan zaznaczeń dla już odpowiedzianych
  for (var k = 0; k < activeIdx.length; k++) {
    var i = activeIdx[k];
    if (st[i] !== -1) {
      applyAnsweredUI(i, st[i]);
    }
  }

  us(); // update status
  if (fw) tf(true); // jeśli filtr był włączony, odśwież widoczność
}

function applyAnsweredUI(i, chosen) {
  var q = Q[i];
  var ok = chosen === q.c;
  var card = document.getElementById("q"+i);
  if (!card) return;

  var fb = document.getElementById("f"+i);
  var ops = card.querySelectorAll(".op");

  for (var k = 0; k < ops.length; k++) {
    ops[k].classList.add("lk");
    if (k === q.c) ops[k].classList.add("gc");
    if (k === chosen && !ok) ops[k].classList.add("gw");
  }

  if (ok) {
    card.classList.add("ok");
    fb.className = "fb fok";
    fb.textContent = "✓ Poprawna odpowiedź!";
  } else {
    card.classList.add("bad");
    fb.className = "fb fno";
    fb.textContent = "✗ Błędna. Poprawna: " + "abcd"[q.c] + ") " + q.o[q.c];
  }
}

function pk(i, j) {
  if (st[i] !== -1) return;

  st[i] = j;
  var q = Q[i];
  var ok = j === q.c;

  applyAnsweredUI(i, j);

  // aktualizuj liczniki tylko dla aktywnego zestawu
  ta++; if (ok) tc++;

  // sekcje statystyki przeliczymy w us()
  us();
}

function us() {
  // przelicz odpowiedzi/correct tylko w obrębie activeIdx (żeby losowane 30 działało poprawnie)
  var a = 0, c = 0;
  for (var k = 0; k < activeIdx.length; k++) {
    var i = activeIdx[k];
    if (st[i] !== -1) {
      a++;
      if (st[i] === Q[i].c) c++;
    }
  }
  ta = a; tc = c;

  var denom = activeIdx.length || 1;
  var p = Math.round((ta / denom) * 100);
  document.getElementById("pf").style.width = p + "%";
  document.getElementById("status").textContent = "Odpowiedziano: " + ta + " / " + denom + (mode === "rnd30" ? " (losowe 30)" : "");
  document.getElementById("modeHint").textContent = "Tryb: " + (mode === "rnd30" ? "losowe 30 pytań" : "pełny test");

  if (ta > 0) {
    var sp = Math.round((tc / ta) * 100);
    document.getElementById("sl").innerHTML = "✓ " + tc + " poprawnych · ✗ " + (ta - tc) + " błędnych · " + sp + "% skuteczności";
  } else {
    document.getElementById("sl").innerHTML = "";
  }

  // update per-section counters in header + sidebar
  buildSectionsFromActive();
  for (var i = 0; i < sections.length; i++) {
    var t = (sections[i].ans > 0) ? (sections[i].ok + "/" + sections[i].ans) : "";
    var e1 = document.getElementById("ss" + i);
    var e2 = document.getElementById("cs" + i);
    if (e1) e1.textContent = t ? t : "—";
    if (e2) e2.textContent = "(" + (t ? t : "—") + ")";
  }
}

function tf(skipToggle) {
  if (!skipToggle) fw = !fw;

  var txt = fw ? "Pokaż wszystkie" : "Pokaż tylko błędne";
  var fb1 = document.getElementById("fb");
  var fb2 = document.getElementById("fb2");
  if (fb1) fb1.textContent = txt;
  if (fb2) fb2.textContent = txt;

  // hide/show question cards
  for (var k = 0; k < activeIdx.length; k++) {
    var i = activeIdx[k];
    var c = document.getElementById("q" + i);
    if (!c) continue;

    if (fw) {
      // pokaż tylko błędne + nieodpowiedziane
      if (st[i] !== -1 && st[i] === Q[i].c) c.classList.add("hd");
      else c.classList.remove("hd");
    } else {
      c.classList.remove("hd");
    }
  }

  // hide sections that become empty under filter
  for (var si = 0; si < sections.length; si++) {
    var sec = sections[si];
    var el = document.getElementById(sec.anchor);
    if (!el) continue;

    if (!fw) { el.classList.remove("hd"); continue; }

    var vis = false;
    for (var t = 0; t < sec.indices.length; t++) {
      var qi = sec.indices[t];
      if (st[qi] === -1 || st[qi] !== Q[qi].c) { vis = true; break; }
    }
    el.classList.toggle("hd", !vis);
  }
}

function resetAnswersOnly() {
  // reset zaznaczeń TYLKO w obrębie aktywnego zestawu
  for (var k = 0; k < activeIdx.length; k++) {
    st[activeIdx[k]] = -1;
  }
  ta = 0; tc = 0; fw = false;
}

function ra() {
  resetAnswersOnly();
  var fb1 = document.getElementById("fb");
  var fb2 = document.getElementById("fb2");
  if (fb1) fb1.textContent = "Pokaż tylko błędne";
  if (fb2) fb2.textContent = "Pokaż tylko błędne";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ====== Losowanie 30 pytań ====== */
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function random30() {
  mode = "rnd30";
  activeIdx = shuffle(allIdx.slice()).slice(0, Math.min(30, allIdx.length));
  activeIdx.sort(function(a,b){ return a-b; }); // żeby sekcje były w logicznej kolejności
  resetAnswersOnly();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showAll() {
  mode = "all";
  activeIdx = allIdx.slice();
  resetAnswersOnly();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ====== start ====== */
render();
</script>
