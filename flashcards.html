<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyApp – Fiszki</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  .fc-header{text-align:center;padding:28px 0 8px}
  .fc-header h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#d1fae5,var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .fc-header p{opacity:.45;font-size:.88rem;margin-top:4px}
  .fc-stats{text-align:center;margin:14px 0;font-family:var(--mono);font-size:.78rem;opacity:.5}
  .fc-scene{width:100%;max-width:520px;height:270px;margin:20px auto;perspective:800px;cursor:pointer}
  .fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
  .fc-card.flipped{transform:rotateY(180deg)}
  .fc-face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:var(--radius);padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .fc-front{background:rgba(99,102,241,.1);border:1.5px solid rgba(99,102,241,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .fc-back{background:rgba(16,185,129,.1);border:1.5px solid rgba(52,211,153,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:rotateY(180deg)}
  .fc-label{font-size:.7rem;font-weight:700;font-family:var(--mono);opacity:.4;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
  .fc-text{font-size:1.15rem;font-weight:800;line-height:1.5}
  .fc-back .fc-text{font-size:.92rem;font-weight:500;line-height:1.6}
  .fc-cat{position:absolute;top:14px;left:18px;font-size:.68rem;font-weight:700;font-family:var(--mono);padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.45)}
  .fc-hint{position:absolute;bottom:14px;font-size:.72rem;opacity:.3}
  .fc-controls{display:flex;justify-content:center;gap:10px;margin:20px 0;flex-wrap:wrap}
  .fc-controls .btn{min-width:100px;justify-content:center}
  .fc-judge{display:flex;justify-content:center;gap:12px;margin:10px 0}
  .fc-judge .btn{min-width:120px;justify-content:center;font-size:.88rem}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent-bright);text-decoration:none;font-size:.85rem;font-weight:700;opacity:.7;transition:opacity .15s;margin-top:20px}
  .back-link:hover{opacity:1}
  .empty-state{text-align:center;padding:60px 20px}
  .empty-icon{width:72px;height:72px;border-radius:22px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.15)}
  .empty-state h2{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#fed7aa,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  .empty-state p{opacity:.4;max-width:380px;margin:0 auto;font-size:.9rem}
  @media(max-width:640px){.fc-scene{height:240px}.fc-text{font-size:1rem}.fc-back .fc-text{font-size:.85rem}}
</style>
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="data/subjects.js"></script>
<script src="data/flashcards-data.js"></script>
<script>Auth.requireAuth();buildNav("flashcards");</script>

<div class="page" id="root"></div>
<div class="fab" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<script>
var sid = getSubjectId();
var subj = getSubject();
var cards = FLASHCARDS_BY_SUBJECT[sid] || [];
document.title = "StudyApp – Fiszki: " + subj.name;

var root = document.getElementById("root");

if (cards.length === 0) {
  root.innerHTML =
    '<div class="fc-header fade-in"><h1>Fiszki: ' + subj.name + '</h1></div>'
    + '<div class="empty-state fade-in-d1">'
    + '<div class="empty-icon">🚧</div>'
    + '<h2>Fiszki pojawią się wkrótce</h2>'
    + '<p>Materiały do tego przedmiotu są w przygotowaniu.</p>'
    + '</div>'
    + '<div style="text-align:center"><a href="subject.html?id=' + sid + '" class="back-link fade-in-d2">← Wróć do przedmiotu</a></div>';
} else {
  root.innerHTML =
    '<div class="fc-header fade-in"><h1>Fiszki: ' + subj.name + '</h1><p>Kliknij kartę, aby ją odwrócić</p></div>'
    + '<div class="pill-scroll fade-in-d1"><div class="pills" id="catPills"></div></div>'
    + '<div class="fc-stats" id="fcStats"></div>'
    + '<div class="fc-scene fade-in-d2" id="fcScene" onclick="flipCard()">'
    + '<div class="fc-card" id="fcCard">'
    + '<div class="fc-face fc-front"><span class="fc-cat" id="fcCat"></span><div class="fc-label">Pojęcie</div><div class="fc-text" id="fcFront"></div><div class="fc-hint">Kliknij, aby odwrócić</div></div>'
    + '<div class="fc-face fc-back"><span class="fc-cat" id="fcCatB"></span><div class="fc-label">Definicja</div><div class="fc-text" id="fcBack"></div><div class="fc-hint">Kliknij ponownie</div></div>'
    + '</div></div>'
    + '<div class="fc-judge" id="fcJudge"><button class="btn danger" onclick="mark(false)">✗ Nie umiem</button><button class="btn success" onclick="mark(true)">✓ Umiem</button></div>'
    + '<div class="fc-controls"><button class="btn" onclick="prev()">← Poprzednia</button><button class="btn accent" onclick="shuf()">🔀 Losuj</button><button class="btn" onclick="next()">Następna →</button></div>'
    + '<div style="text-align:center"><button class="btn" onclick="resetP()">Resetuj postęp</button></div>'
    + '<div style="text-align:center"><a href="subject.html?id=' + sid + '" class="back-link">← Wróć do przedmiotu</a></div>';

  // Logic
  var activeCat = "all", deck = [], idx = 0, known = {};

  function getCats() {
    var c = [];
    cards.forEach(function(f){ if (c.indexOf(f.cat) === -1) c.push(f.cat); });
    return c;
  }

  function buildPills() {
    var cats = getCats();
    var h = '<button class="pill' + (activeCat === "all" ? " active" : "") + '" onclick="setCat(\'all\')">Wszystkie<span class="pill-meta">(' + cards.length + ')</span></button>';
    cats.forEach(function(c) {
      var n = cards.filter(function(f){ return f.cat === c; }).length;
      h += '<button class="pill' + (activeCat === c ? " active" : "") + '" onclick="setCat(\'' + c.replace(/'/g,"\\'") + '\')">' + c + '<span class="pill-meta">(' + n + ')</span></button>';
    });
    document.getElementById("catPills").innerHTML = h;
  }

  function buildDeck() {
    deck = [];
    cards.forEach(function(f, i) {
      if (activeCat === "all" || f.cat === activeCat) deck.push(i);
    });
    idx = 0;
  }

  function setCat(c) { activeCat = c; buildPills(); buildDeck(); show(); }

  function show() {
    if (!deck.length) return;
    if (idx < 0) idx = deck.length - 1;
    if (idx >= deck.length) idx = 0;
    var f = cards[deck[idx]];
    document.getElementById("fcFront").textContent = f.front;
    document.getElementById("fcBack").textContent = f.back;
    document.getElementById("fcCat").textContent = f.cat;
    document.getElementById("fcCatB").textContent = f.cat;
    document.getElementById("fcCard").classList.remove("flipped");
    updS();
  }

  function flipCard() { document.getElementById("fcCard").classList.toggle("flipped"); }
  function next() { idx++; show(); }
  function prev() { idx--; show(); }
  function shuf() {
    for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    idx = 0; show();
  }
  function mark(ok) { known[deck[idx]] = ok; next(); }
  function resetP() { known = {}; updS(); }

  function updS() {
    var kn = 0;
    deck.forEach(function(di) { if (known[di]) kn++; });
    document.getElementById("fcStats").textContent = "Karta " + (idx+1) + " / " + deck.length + "  ·  Umiem: " + kn + " / " + deck.length;
  }

  // Expose to onclick
  window.flipCard = flipCard;
  window.next = next;
  window.prev = prev;
  window.shuf = shuf;
  window.mark = mark;
  window.resetP = resetP;
  window.setCat = setCat;

  buildPills();
  buildDeck();
  show();
}
</script>
</body>
</html>
